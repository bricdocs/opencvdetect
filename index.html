<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Briç Canlı Kart Tanıma Testi</title>
    <style>
        body { font-family: Arial, sans-serif; background: #222; color: #fff; text-align: center; margin: 0; padding: 10px; }
        #videoContainer { position: relative; margin: 10px auto; width: 640px; height: 480px; max-width: 100%; }
        video, canvas { position: absolute; top: 0; left: 0; width: 640px; height: 480px; max-width: 100%; border: 2px solid #555; }
        #statusPanel { margin: 15px auto; padding: 10px; width: 620px; max-width: 100%; background: #333; font-size: 1.2rem; font-weight: bold; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>🃏 Briç Kartı Tanıma Web Paneli</h2>
    
    <div id="videoContainer">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="canvasOutput"></canvas>
    </div>

    <div id="statusPanel">
        <div id="resultText">🔄 Filtre Aşılıyor... OpenCV.js İndiriliyor...</div>
    </div>

    <!-- SİZİN UNCOMPRESSED JSDELIVR LINKINIZ -->
    <script async src="https://jsdelivr.net" type="text/javascript" onload="onOpenCvReady();"></script>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvasOutput');
        const ctx = canvas.getContext('2d');
        const resultText = document.getElementById('resultText');

        // Saf siyah-beyaz şablonlar
        const kartDosyalari = {
            "Maca As": "maca_as.png",
            "Sinek 4": "club_4.png",
            "Sinek 6": "club_6.png",
            "Karo 10": "karo_ten.png",
            "Kupa 5": "kupa_5.png"
        };

        let sablonMatrisleri = {};
        let opencvHazir = false;
        let streamActive = false;

        function onOpenCvReady() {
            console.log("✓ Kütüphane indirildi. Hafızaya tam kurulması için 5 saniye bekleniyor...");
            resultText.innerText = "✓ Kütüphane indirildi. Hafızaya kurulması için 5 saniye bekleniyor...";
            
            // KÜTÜPHANENİN TAM KURULMASI İÇİN KOYDUĞUMUZ 5 SANİYELİK BEKLEME MOLASI:
            setTimeout(function() {
                console.log("✓ 5 saniyelik mola bitti. OpenCV tamamen hazır. Şablonlar yükleniyor...");
                resultText.innerText = "✓ OpenCV tamamen hazır. Şablonlar yükleniyor...";
                opencvHazir = true;
                sablonlariYukle();
            }, 5000); 
        }

        async function sablonlariYukle() {
            try {
                for (let isim in kartDosyalari) {
                    const img = new Image();
                    img.src = kartDosyalari[isim];
                    await new Promise(resolve => img.onload = resolve);
                    
                    let tempCanvas = document.createElement('canvas');
                    tempCanvas.width = img.width;
                    tempCanvas.height = img.height;
                    let tempCtx = tempCanvas.getContext('2d');
                    tempCtx.drawImage(img, 0, 0);
                    
                    let dst = cv.imread(tempCanvas);
                    
                    let dsize = new cv.Size(70, Math.round((70 * img.height) / img.width));
                    let resized = new cv.Mat();
                    cv.resize(dst, resized, dsize, 0, 0, cv.INTER_AREA);
                    
                    sablonMatrisleri[isim] = resized;
                    console.log(`✓ Şablon Tamamen Hazır: ${isim}`);
                    
                    dst.delete();
                }
                resultText.innerText = "✓ Şablonlar hazır. Kamera açılıyor...";
                kamerayiBaslat();
            } catch (err) {
                console.error("Şablon hatası: ", err);
            }
        }

        function kamerayiBaslat() {
            const constraints = {
                video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "environment" },
                audio: false
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then(function(stream) {
                    video.srcObject = stream;
                    video.play();
                    streamActive = true;
                    resultText.innerText = "🔍 Kart aranıyor... Kameraya kart gösterin.";
                    console.log("✓ Kamera akışı başarıyla başlatıldı.");
                    requestAnimationFrame(canliTaramaDongusu);
                })
                .catch(function(err) {
                    console.error("Kamera hatası: ", err);
                    resultText.innerText = "❌ Kamera izin hatası!";
                });
        }

        function canliTaramaDongusu() {
            if (!opencvHazir || !streamActive) return;
            ctx.drawImage(video, 0, 0, 640, 480);
            
            try {
                let src = cv.imread(canvas);
                let gray = new cv.Mat();
                
                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

                let kartBulundu = false;
                let enIyiKart = "";
                let enIyiSkor = 0;
                let enIyiLoc = null;
                let enIyiBoyut = { w: 0, h: 0 };

                for (let isim in sablonMatrisleri) {
                    let sablon = sablonMatrisleri[isim];
                    let result = new cv.Mat();
                    
                    cv.matchTemplate(gray, sablon, result, cv.TM_CCOEFF_NORMED);
                    let minMax = cv.minMaxLoc(result);

                    if (minMax.maxVal >= 0.55 && minMax.maxVal > enIyiSkor) {
                        enIyiSkor = minMax.maxVal;
                        enIyiKart = isim;
                        enIyiLoc = minMax.maxLoc;
                        enIyiBoyut = { w: sablon.cols, h: sablon.rows };
                        kartBulundu = true;
                    }
                    result.delete(); 
                }

                if (kartBulundu) {
                    resultText.innerText = `KART ALGILANDI: ${enIyiKart} (%${Math.round(enIyiSkor * 100)})`;
                    resultText.style.color = "#00ff00";

                    ctx.beginPath();
                    ctx.lineWidth = "4";
                    ctx.strokeStyle = "#00ff00";
                    ctx.rect(enIyiLoc.x, enIyiLoc.y, enIyiBoyut.w, enIyiBoyut.h);
                    ctx.stroke();
                } else {
                    resultText.innerText = "Kart aranıyor... Kameraya bir kart gösterin.";
                    resultText.style.color = "#fff";
                }

                src.delete(); gray.delete();
            } catch (err) {
                console.error("Döngü hatası: ", err);
            }
            requestAnimationFrame(canliTaramaDongusu);
        }
    </script>
</body>
</html>
